name: Refresh and deploy ER Wait Live

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: er-wait-live-pages
  cancel-in-progress: true

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect current hospital data
        continue-on-error: true
        run: python scripts/collect.py

      - name: Save observation history
        run: |
          if ! git diff --quiet -- public/data.json; then
            git config user.name "ER Wait Live Bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/data.json
            git commit -m "[skip ci] Refresh ER wait data"
            git push
          fi

      - name: Add 24-hour intelligence experiment
        run: |
          rm -rf public/experiment
          cp -R experiment public/experiment

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
